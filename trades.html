<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Occupations Audit — Newport Street Directory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="src/styles/main.css">
  
  <style>
    body { 
      padding: 0;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 2.5rem 1.5rem; }

    .page-header {
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    h1 {
      font-family: var(--heading-font);
      font-size: 3rem;
      color: var(--accent);
      font-weight: 400;
      line-height: 1.1;
    }

    .subtitle { color: var(--muted); font-size: 1rem; margin-top: 0.25rem; }

    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .search-input {
      flex: 1;
      padding: 0.85rem 1.25rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 4px;
      font-size: 1rem;
      outline: none;
    }

    .search-input:focus { border-color: var(--accent); }

    .stats-badge {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 0.85rem 1.5rem;
      border-radius: 4px;
      font-size: 0.9rem;
      color: var(--accent);
      white-space: nowrap;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      overflow: hidden;
    }

    th, td {
      padding: 1rem 1.25rem;
      text-align: left;
      border-bottom: 1px solid var(--card-border);
    }

    th {
      background: #171310;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(200, 157, 84, 0.05); }

    .count-col { width: 120px; font-weight: 600; color: var(--accent); }
    .example-col { color: var(--muted); font-size: 0.9rem; }

    .btn {
      padding: 0.75rem 1.25rem;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      transition: all 0.2s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-secondary {
      background: rgba(200, 157, 84, 0.1);
      border-color: rgba(200, 157, 84, 0.3);
      color: var(--accent);
    }

    .btn-secondary:hover {
      background: rgba(200, 157, 84, 0.2);
    }

    .tabs-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.5rem;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: var(--sans-font);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      color: var(--accent);
      background: rgba(200, 157, 84, 0.15);
    }

    .tab-badge {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 0.1rem 0.45rem;
      border-radius: 10px;
    }

    .tab-btn.active .tab-badge {
      background: var(--accent);
      color: #120f0d;
    }
  </style>
</head>
<body>

  <header>
    <div class="page-width">
      <div class="header-inner">
        <a href="index.html#home" class="logo">
          <span>🏛️</span> Newport Directory Archive
        </a>
        <nav>
          <a href="index.html#home">Home</a>
          <a href="index.html#directories">Directories</a>
          <a href="index.html#streets">All Streets</a>
          <a href="map.html" class="nav-btn" style="background: rgba(200, 157, 84, 0.15); border-color: var(--accent); color: var(--accent);">🗺️ Map Explorer</a>
          <a href="trades.html" class="nav-btn active" style="background: var(--accent); color: var(--bg);">Occupations Audit</a>
        </nav>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="page-header">
      <div>
        <h1>Occupation Audit</h1>
        <div class="subtitle">Reviewing unique trades across Newport Directory records</div>
      </div>
      <div style="display: flex; gap: 1rem; align-items: center;">
        <button id="view-overrides-btn" class="btn btn-secondary" onclick="showOverridesModal()">Rules (0)</button>
        <div class="stats-badge" id="total-count">0 Unique Trades Found</div>
      </div>
    </div>

    <div class="tabs-bar">
      <button class="tab-btn active" data-tab="all" onclick="switchTab('all')">
        All Occupations <span class="tab-badge" id="tab-count-all">0</span>
      </button>
      <button class="tab-btn" data-tab="issues" onclick="switchTab('issues')">
        ⚠️ Needs Review <span class="tab-badge" id="tab-count-issues" style="background: rgba(245, 101, 101, 0.3); color: #f56565;">0</span>
      </button>
      <button class="tab-btn" data-tab="verified" onclick="switchTab('verified')">
        ✓ Verified <span class="tab-badge" id="tab-count-verified">0</span>
      </button>
      <button class="tab-btn" data-tab="overridden" onclick="switchTab('overridden')">
        ✏️ Custom Rules <span class="tab-badge" id="tab-count-overridden">0</span>
      </button>
    </div>

    <div class="controls">
      <input type="text" id="trade-search" class="search-input" placeholder="Filter occupations (e.g. Labourer, Driver, Mason)..." />
    </div>

    <table>
      <thead>
        <tr>
          <th>Occupation / Trade</th>
          <th class="count-col">Frequency</th>
          <th class="example-col">Sample Entry</th>
          <th style="width: 220px; text-align: right;">Action</th>
        </tr>
      </thead>
      <tbody id="trade-table-body">
        <tr><td colspan="4" style="color: var(--muted);">Loading trade records...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    let tradeMap = new Map();
    const NON_TRADES_REGEX = /^(mrs\.?|miss\.?|mr\.?|thos\.?|jas\.?|wm\.?|saml\.?|john|geo\.?|chas\.?|hy\.?|richd\.?|harry|ernest|fredk\.?|arthur|edwd\.?|walt\.?|david|danl\.?|benj\.?|stepn\.?|iss e|ltd\.?|limited|co\.?|& co\.?|co\.? ltd\.?|ld\.?|henry|joseph|albert|reginald|harold|alfred|frank|edward|herbert|edwin|fred|norman|ivor|stanley|leslie|sidney|horace|edgar|lewis|percy|wilfred|bernard|eric|clifford|trevor|return\.?|junr?\.?|&|&c|etc|\{.*\}|;;;)$/i;

    // Overrides & Verified Management via localStorage
    let tradeOverrides = JSON.parse(localStorage.getItem('trade_overrides') || '{}');
    let verifiedTrades = new Set(JSON.parse(localStorage.getItem('trade_verified') || '[]'));
    let currentFilterTab = 'all'; // 'all', 'issues', 'verified', 'overridden'

    function saveOverrides() {
      localStorage.setItem('trade_overrides', JSON.stringify(tradeOverrides));
    }

    function saveVerified() {
      localStorage.setItem('trade_verified', JSON.stringify(Array.from(verifiedTrades)));
    }

    function toggleVerified(canonicalName) {
      if (verifiedTrades.has(canonicalName)) {
        verifiedTrades.delete(canonicalName);
      } else {
        verifiedTrades.add(canonicalName);
      }
      saveVerified();
      renderTable(document.getElementById('trade-search').value);
      updateTabCounts();
    }

    function isLikelyIssue(trade, data) {
      // 1. Non-trade / Address / Waypoint leftovers
      if (/^(here is|here are|from\s+\d+|from\s+newport|\(?the roundabout\)?)/i.test(trade)) return true;
      if (/^(tel|telephone|newport\s+\d+|\d+\s*\(after)/i.test(trade)) return true;
      if (/^\(flat\s+\d+/i.test(trade)) return true;
      
      // 2. Short or strange punctuation/abbreviations leftover
      if (/[;\/:_\{\}\[\]\\\|]/.test(trade)) return true;
      if (/\b(dvr|drvr|ptr|clk|trm|labr|wkr|agt|mer|co|ltd|mcht|eng)\b/i.test(trade)) return true;
      if (trade.length <= 3 && trade !== 'G.W.R.' && trade !== 'G.P.O.') return true;
      // 3. Contains digits or unusual mixed casing
      if (/\d/.test(trade)) return true;
      // 4. Raw variants contain obvious uncleaned shortcuts
      if (data.rawSamples.some(r => /[\;\:\\\/_\{\}]/.test(r) || /\b(do\.?|ditto)\b/i.test(r))) return true;
      return false;
    }

    function cleanOccupation(trade) {
      if (!trade) return 'Residence / Private';
      let clean = trade.trim();

      // Check user overrides first
      if (tradeOverrides[clean.toLowerCase()]) {
        return tradeOverrides[clean.toLowerCase()];
      }

      // Catch JSON block spills (e.g. Butcher"", ""Business / Entity"":""..."", Outfitter And Pawnbroker...)
      if (/\{|""|Business \/ Entity|Layout \/ Notes|Forenames|Surname/i.test(clean)) {
        if (/butcher/i.test(clean)) return 'Butcher';
        if (/outfitter/i.test(clean)) return 'Outfitter';
        if (/pawnbroker/i.test(clean)) return 'Pawnbroker';
        return 'Residence / Private';
      }

      // Catch Bengali or non-ASCII OCR artifacts (e.g. "ভিন")
      if (/[\u0980-\u09FF\u0600-\u06FF\u0400-\u04FF\u4E00-\u9FFF]/.test(clean)) {
        return 'Residence / Private';
      }

      // Catch year-only spills in parentheses or raw (e.g. "(1910)", "1910", ". S")
      if (/^\(?\d{4}\)?$/i.test(clean) || /^\.\s*[a-z]$/i.test(clean)) {
        return 'Residence / Private';
      }

      // Catch professional qualifications / engineering suffixes
      if (/^m\.?i\.?c\.?e\.?/i.test(clean) || /^r\.?c\.?s\.?/i.test(clean)) {
        if (/civ\.?\s*eng/i.test(clean) || /eng/i.test(clean)) return 'Civil Engineer';
        if (/surg|dentist/i.test(clean)) return 'Dental Surgeon';
        return 'Civil Engineer';
      }

      // Catch long multi-line advertisement spills (e.g. "India Rubber, Gutta Percha...", "Guest, Keen & Nettlefolds...", "Colliery Proprietors...", "Al Exporters...")
      if (/gutta percha|hose packings|steamship and colliery furnishers|imperial mills|colliery proprietors|agents for the united national/i.test(clean)) {
        if (/rubber|gutta percha/i.test(clean)) return 'India Rubber & Gutta Percha Manufacturers';
        if (/mills|nettlefolds/i.test(clean)) return 'Iron & Steel Manufacturers';
        if (/colliery|coal/i.test(clean)) return 'Colliery Proprietors & Coal Exporters';
        return 'Commercial Business';
      }

      // 1. Catch Waypoints, Address Spills, Flat numbers, Phone numbers, & Non-trade OCR spills
      if (
        /^(here is|here are|from\s+\d+|from\s+[a-z]+|\(?the roundabout\)?|\(?flat\s+\d+.*?\)?)/i.test(clean) ||
        /^(tel\.?|telephone|newport\s+\d+|\d+\s*\(after|\d+[a-z]?,?\s*workers)/i.test(clean) ||
        /^(do\.?|ditto|[-—_\|\\\[\]\{\}\.\,\&\;\:\?\!]+|&c|etc|\(?return\)?\.?|;;;)$/i.test(clean) ||
        /^(ltd\.?|co\.?|& co\.?|co\.?\s+ltd\.?|ltd\.?,\s*ltd|ltd\.?,\s*co\.?|gas\s+co|way\s+co\.?'?s?\s*office|1st\s+floor|2nd\s+floor|3rd\s+floor)$/i.test(clean) ||
        /^(&|\*|are|for|de|en|et|si|tai|vw|wks|rd|to\s+\d+\s+unbuilt|\(3\)|p\.o\.?|& m|& b|and at cardiff.*)$/i.test(clean) ||
        NON_TRADES_REGEX.test(clean)
      ) {
        return 'Residence / Private';
      }

      // Filter house/villa/building names left in trade column (e.g., "The Woodlands", "Norwood", "Eversley", "Rosetta", "Brynholme", "Gasworks", "Woolmer")
      if (
        /^(the\s+woodlands|norwood|eversley|rosetta|brynholme|gasworks|woolmer)$/i.test(clean) ||
        /^(bryn|villas?|cottage|house|lodge|manor|hall|court|view|terrace|gardens)\b/i.test(clean)
      ) {
        return 'Residence / Private';
      }

      // Handle "do. [Trade]" or "ditto [Trade]" patterns
      clean = clean.replace(/^(?:\d+\s+)?(?:do\.?|ditto)\s*[\.,]*\s*(?:\[(.*?)\]|(.*?))$/i, (m, g1, g2) => (g1 || g2 || '').trim());
      clean = clean.replace(/^[-—_\|,\s]+/, '').replace(/[-—_\|,\s]+$/, '').trim();

      // Strip house numbers and address prefixes (e.g. "20-24, Boot Repairer" -> "Boot Repairer", "52, Labourer" -> "Labourer", "Engrocer, 19 Foster F. J. Greengrocer")
      clean = clean
        .replace(/^\(from\s+\d+[^)]*\)\s*/i, '')
        .replace(/^\[?(\d+[-\d]*[a-z]?),?\s*/i, '')
        .replace(/^\d+[a-z]?,\s*/i, '')
        .replace(/\s+\d+[a-z]?$/i, '')
        .replace(/^\[/g, '')
        .replace(/\]$/g, '')
        .replace(/^[a-z]+,\s*\d+\s+[a-z\s\.,']+/i, '')
        .trim();

      // Strip person name spills and company spills preceding trades (e.g. "Hitchcox & Co. Land Agents..." -> "Land Agents...", "Jones & Co. Steam Ship Owners..." -> "Steamship Owners...", "Nantyglo & Blaina... Brickworks" -> "Brickworks & Pottery")
      clean = clean
        .replace(/^[a-z\s\.,'\-]+\b(mrs|mr|miss)\b.*?,?\s*/i, '')
        .replace(/^[a-z\s\.,'\-]+\b(and|&)\s+co\.?'?s?\s+(offices|works|stores|yard)\s*,?\s*/i, '')
        .replace(/^[a-z0-9\s\.,'&\-]+\b(co\.?|ltd\.?|& co\.?)\s*,?\s*(land agents|surveyors|auctioneers|shipping agents|steam\s*ship|coal exporters|brickworks|milliners|iron|draper)/i, '$2')
        .replace(/^[a-z\s\.,'\-]+,?\s*(mar\.?\s*eng'?n?r|eng'?r|eng'?n?r)/i, '$1');

      // De-duplicate concatenated OCR phrases (e.g. "Milliners, Ltd., Milliners" -> "Milliners", "Baby Linen... Outfitters, Ltd., Baby Linen..." -> "Baby Linen & Childrens Outfitters", "Brewers, Ltd." -> "Brewers")
      clean = clean.replace(/^([^,\-]+?)\s*[\,;\—\-].*?\b\1\b/i, '$1').trim();

      // Clean leading & trailing company suffixes
      clean = clean
        .replace(/^(ltd\.?|co\.?|& co\.?|& co\.?,?\s*ltd\.?|and co\.?)\s*,?\s*/i, '')
        .replace(/[\,;\s]+(ltd\.?|co\.?|& co\.?|co\.?\s+ltd\.?)$/i, '')
        .trim();

      if (!clean || clean === '-' || clean === '—' || /^(ltd\.?|co\.?|& co\.?|&|and)$/i.test(clean) || NON_TRADES_REGEX.test(clean)) {
        return 'Residence / Private';
      }

      // Clean trailing ", &c" / ", etc" / "(return)" / Phone number suffixes / Ditto fragments
      clean = clean
        .replace(/[\,;\s]+(?:&c|etc)\.?$/i, '')
        .replace(/\s*\(\s*return\s*\)\.?$/i, '')
        .replace(/\s*\(\s*tel\.?\s*\d+.*?\)$/i, '')
        .replace(/\s+ditto$/i, '')
        .trim();

      // Clean municipal address spills & institution fragment lines
      if (
        /^(county borough of|council offices|home for the aged|home for aged|aged \(men\)|aged \(females\))/i.test(clean) ||
        /^(independent order of|adult education|british steel corporation|engineering & foundry)/i.test(clean)
      ) {
        if (/county borough of/i.test(clean)) return 'Municipal / Council Office';
        if (/home for/i.test(clean) || /aged \(/i.test(clean)) return 'Care Home / Residential Home';
        if (/independent order/i.test(clean)) return 'Friendly Society / Lodge';
        if (/adult education/i.test(clean)) return 'Educational Institution';
        if (/british steel/i.test(clean)) return 'Steel Works / Office';
        if (/engineering & foundry/i.test(clean)) return 'Engineering & Foundry';
      }

      // Handle School institutional titles
      if (/school|junior high|senior high|grammar school|convent school/i.test(clean)) {
        return 'School / Educational Institution';
      }

      // Specific multi-line commercial consolidations & compound expansions
      if (/^dkr$/i.test(clean)) return 'Docker';
      if (/^eng\.?\s*du'?vr$/i.test(clean)) return 'Engine Driver';
      if (/^m'?sion\s*agt$/i.test(clean)) return 'Commission Agent';
      if (/^m\.?b\.?\s*do$/i.test(clean)) return 'Physician & Surgeon';
      if (/^house\s*agt$/i.test(clean)) return 'House Agent';
      if (/^wol\s*mcht$/i.test(clean)) return 'Wool Merchant';
      if (/^min\.?\s*eng$/i.test(clean)) return 'Mining Engineer';
      if (/^engr\s*&\s*mer$/i.test(clean)) return 'Engineer & Merchant';
      if (/^eng\.?,\s*surg\.?\s*dentist$/i.test(clean)) return 'Dental Surgeon';
      if (/^l\.?d\.?s\.?,?\s*r\.?c\.?s\.?/i.test(clean)) return 'Dental Surgeon';
      if (/^wgn$/i.test(clean)) return 'Wagon Repairer';
      if (/^dgr$/i.test(clean)) return 'Dredger';
      if (/bootmaker/i.test(clean)) return 'Bootmaker';
      if (/bakers?.*confection/i.test(clean)) return 'Baker & Confectioner';
      if (/dispensing chemist/i.test(clean)) return 'Chemist';
      if (/potato mer/i.test(clean)) return 'Potato Merchant';
      if (/provision mer/i.test(clean)) return 'Provision Merchant';
      if (/builders?.*merchant/i.test(clean)) return 'Builders Merchant';
      if (/china.*glass/i.test(clean)) return 'China & Glass Merchant';
      if (/consulting eng/i.test(clean)) return 'Consulting Engineer';
      if (/newsagent.*stationer/i.test(clean)) return 'Newsagent & Stationer';
      if (/surveyor.*estate agent/i.test(clean)) return 'Estate Agent & Surveyor';
      if (/scrap.*metal/i.test(clean)) return 'Scrap Metal Merchant';
      if (/john ambulance/i.test(clean)) return 'St. John Ambulance Hall';

      clean = clean
        .replace(/\bg[\.\s]*w[\.\s]*r[\.\s]*/gi, 'G.W.R. ')
        .replace(/G\.W\.R\.\s*[\.,]+/gi, 'G.W.R. ')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/G\.W\.R\.\s*$/gi, 'G.W.R.')
        .replace(/\bgov\.?\s+offcl\b/gi, 'Government Official')
        .replace(/\bdk\s+police\b/gi, 'Dock Police')
        .replace(/\bldg\s+ho\b/gi, 'Lodging House')
        .replace(/\bdrapers\s+collctr\b/gi, 'Drapers Collector')
        .replace(/\bgas\s+inspct\b/gi, 'Gas Inspector')
        .replace(/\bblrmr\b/gi, 'Boilermaker')
        .replace(/\bcustom\s+offr\b/gi, 'Custom Officer')
        .replace(/\bglass\s+(wrkr|wk)\b/gi, 'Glass Worker')
        .replace(/\bice\s+cream\s+vendr\b/gi, 'Ice Cream Vendor')
        .replace(/\bcoal\s+tipr\b/gi, 'Coal Tipper')
        .replace(/\bdentst\b/gi, 'Dentist')
        .replace(/\bbus\s+drvi\b/gi, 'Bus Driver')
        .replace(/\bwagon\s+rp\b/gi, 'Wagon Repairer')
        .replace(/\b(electcn|electrn|elect|elct)\b/gi, 'Electrician')
        .replace(/\bflour\s+packr\b/gi, 'Flour Packer')
        .replace(/\broad\s+swp\b/gi, 'Road Sweeper')
        .replace(/\b(ironwor|ironwrkr|ironworkr|iworker|irn\s+worker)\b/gi, 'Ironworker')
        .replace(/\bbuilding\s+contr\s*&\s*engnrs\b/gi, 'Building Contractors and Engineers')
        .replace(/\bsales\s+drvr\b/gi, 'Sales Driver')
        .replace(/\btbeworker\b/gi, 'Tubeworker')
        .replace(/\bshoe\s+repr\b/gi, 'Shoe Repairer')
        .replace(/\bsteehvorkr\b/gi, 'Steelworker')
        .replace(/\bcrane\s+dr\b/gi, 'Crane Driver')
        .replace(/\belec\s+engineer\b/gi, 'Electrical Engineer')
        .replace(/\bstl\s+worker\b/gi, 'Steel Worker')
        .replace(/\bmotor\s+(drvr|dr)\b/gi, 'Motor Driver')
        .replace(/\bins\.?\s*agt\.?\b/gi, 'Insurance Agent')
        .replace(/\binsur\.?\s*agent\b/gi, 'Insurance Agent')
        .replace(/\bins\s+mercht?\b/gi, 'Insurance Merchant')
        .replace(/\bcoal\s+mercht?\b/gi, 'Coal Merchant')
        .replace(/\bcoal\s+mer\b/gi, 'Coal Merchant')
        .replace(/\bpostmn\b/gi, 'Postman')
        .replace(/\bcivil\s+serv(t|nt)\b/gi, 'Civil Servant')
        .replace(/\bdk\s+worker\b/gi, 'Dock Worker')
        .replace(/\btrmr\b/gi, 'Trimmer')
        .replace(/\bbricklayr\b/gi, 'Bricklayer')
        .replace(/\bsupt\.?\b/gi, 'Superintendent')
        .replace(/\bupholstr\b/gi, 'Upholsterer')
        .replace(/\bloco\s+driver\b/gi, 'Locomotive Driver')
        .replace(/\bclrk\b/gi, 'Clerk')
        .replace(/\b(steelworkr|steehvorkr|stlwrkr)\b/gi, 'Steelworker')
        .replace(/\bship\s+brkr\b/gi, 'Ship Broker')
        .replace(/\bfitters\s+hlpr\b/gi, 'Fitters Helper')
        .replace(/\bmarbl\s+polshr\b/gi, 'Marble Polisher')
        .replace(/\bcab\s+proprtr\b/gi, 'Cab Proprietor')
        .replace(/\bmonu\.?\s+mason\b/gi, 'Monumental Mason')
        .replace(/\brailwymn\b/gi, 'Railwayman')
        .replace(/\brly\s+foreman\b/gi, 'Railway Foreman')
        .replace(/\brly\s+inspt\b/gi, 'Railway Inspector')
        .replace(/\btram\s+inspt\b/gi, 'Tram Inspector')
        .replace(/\binspt\b/gi, 'Inspector')
        .replace(/\bironw6rker\b/gi, 'Ironworker')
        .replace(/\bgeneral\s+grocr\b/gi, 'General Grocer')
        .replace(/\blaborr\b/gi, 'Labourer')
        .replace(/\bpier\s+mastr\b/gi, 'Pier Master')
        .replace(/\bhouse\s+fur\b/gi, 'House Furnisher')
        .replace(/\bhatter\s*,\s*,\s*etc\b/gi, 'Hatter, etc.')
        .replace(/\bboot\s+manuftrs\b/gi, 'Boot Manufacturers')
        .replace(/\bphotogrpr\b/gi, 'Photographer')
        .replace(/\bmotormn\b/gi, 'Motorman')
        .replace(/\btug\s+drvr\b/gi, 'Tug Driver')
        .replace(/\belec\.?\s+eng\b/gi, 'Electrical Engineer')
        .replace(/\bcoachmn\b/gi, 'Coachman')
        .replace(/\brway\s+ganger\b/gi, 'Railway Ganger')
        .replace(/\beng\.?\s+drvr\.?\s+g\.?w\.?r\.?\b/gi, 'Engine Driver G.W.R.')
        .replace(/\bwoodtrnr\b/gi, 'Woodturner')
        .replace(/\btel\.?\s+clerk\b/gi, 'Telephone Clerk')
        .replace(/\bcellrmn\b/gi, 'Cellarman')
        .replace(/\bstrkr\b/gi, 'Striker')
        .replace(/\b(l;ab|labour[\x27\x22\x60]?r|lab[\x27\x22\x60]?r|lab[\x27\x22\x60]?rer)\b/gi, 'Labourer')
        .replace(/\btail;ors\b/gi, 'Tailors')
        .replace(/\bbrewerr\b/gi, 'Brewer')
        .replace(/\bprovision\s+merchanty\b/gi, 'Provision Merchant')
        .replace(/\bglass\s+blr\b/gi, 'Glassblower')
        .replace(/\btransp[\x27\x22\x60]?t\s+w[\x27\x22\x60]?r\b/gi, 'Transport Worker')
        .replace(/\bcr\.?\s*driver\b/gi, 'Crane Driver')
        .replace(/\btr[\x27\x22\x60]?mmer\b/gi, 'Trimmer')
        .replace(/\bhse\s+craft\s+mistress\b/gi, 'House Craft Mistress')
        .replace(/\bcanteen\s+stwd\b/gi, 'Canteen Steward')
        .replace(/\biron\s*&\s*metal\s+mcht\s+and\s+marine\s+stores\b/gi, 'Iron & Metal Merchant and Marine Stores')
        .replace(/\biworker\s*&\s*shop\b/gi, 'Ironworker and Shop')
        .replace(/\bnews\s*&\s*hairdr\b/gi, 'News and Hairdresser')
        .replace(/\bturf\s+acnt\b/gi, 'Turf Accountant')
        .replace(/\bahopkeeper\b/gi, 'Shopkeeper')
        .replace(/\btime\s+kp\b/gi, 'Timekeeper')
        .replace(/\bpump\s+attd?t\b/gi, 'Pump Attendant')
        .replace(/\bcoal\s+tmr\b/gi, 'Coal Trimmer')
        .replace(/\bblksth\b/gi, 'Blacksmith')
        .replace(/\bschool\s+teach\b/gi, 'School Teacher')
        .replace(/\bshop\s+ft[\x27\x22\x60]?rs\b/gi, 'Shop Fitters')
        .replace(/\binsurnc\s+agt\b/gi, 'Insurance Agent')
        .replace(/\bhead\s+waitr\b/gi, 'Head Waiter')
        .replace(/\brailwaymn\b/gi, 'Railwayman')
        .replace(/\bbootmkrs\b/gi, 'Bootmakers')
        .replace(/\bgreengrcrs\b/gi, 'Greengrocers')
        .replace(/\bpolice\s+sgt\b/gi, 'Police Sergeant')
        .replace(/\btobacnst\b/gi, 'Tobacconist')
        .replace(/\bbuilders\s+yd\b/gi, 'Builders Yard')
        .replace(/\bsecty\b/gi, 'Secretary')
        .replace(/\bgenl\s+dealer\b/gi, 'General Dealer')
        .replace(/\bcellarmn\b/gi, 'Cellarman')
        .replace(/\btravellr\b/gi, 'Traveller')
        .replace(/\bcycle\s+repr\b/gi, 'Cycle Repairer')
        .replace(/\benginemn\b/gi, 'Engineman')
        .replace(/\bpipe\s+fittr\b/gi, 'Pipe Fitter')
        .replace(/\bstocktkr\b/gi, 'Stocktaker')
        .replace(/\bwheelwgt\b/gi, 'Wheelwright')
        .replace(/\bwardrobe\s+dlr\b/gi, 'Wardrobe Dealer')
        .replace(/\bdecor[\x27\x22\x60]?tr\b/gi, 'Decorator')
        .replace(/\bboilermk\b/gi, 'Boilermaker')
        .replace(/\bpltlyr\b/gi, 'Platelayer')
        .replace(/\bglass\s+wks\b/gi, 'Glass Works')
        .replace(/\bins\.?\s+superintendent\b/gi, 'Insurance Superintendent')
        .replace(/\bgenl\.?\s+shop\b/gi, 'General Shop')
        .replace(/\bironwkr\b/gi, 'Ironworker')
        .replace(/\bstlwkr\b/gi, 'Steelworker')
        .replace(/wkr\b/gi, 'worker');

      // 2. Standard trade abbreviations
      clean = clean
        .replace(/\blabr\b/gi, 'Labourer')
        .replace(/\bdvr\b/gi, 'Driver')
        .replace(/\bdrvr\b/gi, 'Driver')
        .replace(/\bdrivr\b/gi, 'Driver')
        .replace(/\beng\.?\s+driver\b/gi, 'Engine Driver')
        .replace(/\beng\.?\s+dvr\b/gi, 'Engine Driver')
        .replace(/\bptr\b/gi, 'Painter')
        .replace(/\bclk\b/gi, 'Clerk')
        .replace(/\btrm\b/gi, 'Trimmer')
        .replace(/\bbricklyr\b/gi, 'Bricklayer')
        .replace(/\bcarptr\b/gi, 'Carpenter')
        .replace(/\beng dvr\b/gi, 'Engine Driver');

      // 3. Preserve G.W.R. and G.P.O. casing if present
      clean = clean.replace(/\b(g\.?p\.?o\.?)\b\.?/gi, 'G.P.O.');
      clean = clean.replace(/\w\S*/g, (txt) => {
        if (txt.toUpperCase() === 'G.W.R.') return 'G.W.R.';
        if (txt.toUpperCase() === 'G.P.O.') return 'G.P.O.';
        return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
      });

      return clean;
    }

    let csvLinesRaw = [];

    function parseCSVLine(line) {
      const result = [];
      let start = 0;
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        if (line[i] === '"') {
          inQuotes = !inQuotes;
        } else if (line[i] === ',' && !inQuotes) {
          let field = line.substring(start, i).trim();
          if (field.startsWith('"') && field.endsWith('"')) field = field.slice(1, -1);
          result.push(field);
          start = i + 1;
        }
      }
      let lastField = line.substring(start).trim();
      if (lastField.startsWith('"') && lastField.endsWith('"')) lastField = lastField.slice(1, -1);
      result.push(lastField);
      return result;
    }

    async function loadTrades() {
      const tbody = document.getElementById('trade-table-body');
      try {
        const response = await fetch('data.csv');
        if (!response.ok) {
          throw new Error(`HTTP ${response.status} ${response.statusText}`);
        }
        const text = await response.text();
        csvLinesRaw = text.trim().split('\n');
        parseAndGroupTrades();
      } catch (err) {
        console.error("Failed to load CSV", err);
        if (tbody) {
          tbody.innerHTML = `<tr><td colspan="4" style="color: #ff6b6b;">Failed to load data.csv (${err.message}). If opening as a local file (file://), please view via Live Server or a local HTTP web server.</td></tr>`;
        }
      }
    }

    function parseAndGroupTrades() {
      tradeMap.clear();

      for (let i = 1; i < csvLinesRaw.length; i++) {
        const line = csvLinesRaw[i].trim();
        if (!line) continue;

        const cols = parseCSVLine(line);
        if (cols.length < 2) continue;

        let surname = cols[4] || '';
        let forename = cols[5] || '';
        let rawTrade = cols[6] || '';

        // Handle Thompson name/trade split fix
        if (forename && !rawTrade) {
          const match = forename.match(/^([A-Z]\.?(?:\s+[A-Z]\.?)?)\s+([a-z].*)$/);
          if (match) {
            forename = match[1];
            rawTrade = match[2];
          }
        }

        const tradeKey = cleanOccupation(rawTrade);
        const sampleName = `${forename} ${surname}`.trim();

        if (tradeMap.has(tradeKey)) {
          const item = tradeMap.get(tradeKey);
          item.count++;
          if (rawTrade && !item.rawSamples.includes(rawTrade)) {
            item.rawSamples.push(rawTrade);
          }
        } else {
          tradeMap.set(tradeKey, { 
            count: 1, 
            sample: sampleName,
            rawSamples: rawTrade ? [rawTrade] : []
          });
        }
      }

      updateTabCounts();
      renderTable(document.getElementById('trade-search').value);
      renderOverridesBadge();
    }

    function updateTabCounts() {
      let issuesCount = 0;
      let verifiedCount = 0;
      let overriddenCount = 0;

      tradeMap.forEach((data, trade) => {
        const isCustom = data.rawSamples.some(r => tradeOverrides[r.toLowerCase()]);
        const isVerified = verifiedTrades.has(trade);
        const hasIssue = isLikelyIssue(trade, data);

        if (isCustom) overriddenCount++;
        if (isVerified) verifiedCount++;
        if (hasIssue && !isVerified && !isCustom) issuesCount++;
      });

      document.getElementById('tab-count-all').innerText = tradeMap.size;
      document.getElementById('tab-count-issues').innerText = issuesCount;
      document.getElementById('tab-count-verified').innerText = verifiedCount;
      document.getElementById('tab-count-overridden').innerText = overriddenCount;
    }

    function switchTab(tabName) {
      currentFilterTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabName);
      });
      renderTable(document.getElementById('trade-search').value);
    }

    function renderOverridesBadge() {
      const overrideCount = Object.keys(tradeOverrides).length;
      const btn = document.getElementById('view-overrides-btn');
      if (btn) {
        btn.innerText = `Rules (${overrideCount})`;
      }
    }

    function editTradeRule(canonicalName, rawSamples) {
      const newName = prompt(`Enter corrected canonical trade name for "${canonicalName}":`, canonicalName);
      if (newName === null) return;

      const trimmed = newName.trim();
      if (!trimmed) return;

      // Add override mapping for all raw variants under this canonical name
      if (rawSamples && rawSamples.length > 0) {
        rawSamples.forEach(raw => {
          tradeOverrides[raw.toLowerCase()] = trimmed;
        });
      } else {
        tradeOverrides[canonicalName.toLowerCase()] = trimmed;
      }

      // Automatically mark as verified when rule is added
      verifiedTrades.add(trimmed);
      saveVerified();
      saveOverrides();
      parseAndGroupTrades();
    }

    function renderTable(filterQuery = '') {
      const tbody = document.getElementById('trade-table-body');
      tbody.innerHTML = '';

      const cleanQuery = filterQuery.toLowerCase().trim();
      
      const sortedTrades = Array.from(tradeMap.entries())
        .filter(([trade, data]) => {
          if (cleanQuery && !trade.toLowerCase().includes(cleanQuery)) return false;
          
          const isCustom = data.rawSamples.some(r => tradeOverrides[r.toLowerCase()]);
          const isVerified = verifiedTrades.has(trade);
          const hasIssue = isLikelyIssue(trade, data);

          if (currentFilterTab === 'issues') {
            return hasIssue && !isVerified && !isCustom;
          }
          if (currentFilterTab === 'verified') {
            return isVerified;
          }
          if (currentFilterTab === 'overridden') {
            return isCustom;
          }
          return true;
        })
        .sort((a, b) => b[1].count - a[1].count);

      document.getElementById('total-count').innerText = `${sortedTrades.length} Occupations Displayed`;

      if (sortedTrades.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="color: var(--muted);">No occupations match this filter.</td></tr>';
        return;
      }

      sortedTrades.forEach(([trade, data]) => {
        const tr = document.createElement('tr');
        const isCustom = data.rawSamples.some(r => tradeOverrides[r.toLowerCase()]);
        const isVerified = verifiedTrades.has(trade);
        const hasIssue = isLikelyIssue(trade, data);

        const tdName = document.createElement('td');
        tdName.innerHTML = `
          <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
            <span class="trade-title" style="font-weight: 500;"></span>
            ${isVerified ? '<span style="font-size: 0.75rem; background: rgba(72, 187, 120, 0.2); color: #48bb78; padding: 0.1rem 0.4rem; border-radius: 3px; font-weight: 500;">✓ Verified</span>' : ''}
            ${isCustom ? '<span style="font-size: 0.75rem; background: rgba(200, 157, 84, 0.2); color: var(--accent); padding: 0.1rem 0.4rem; border-radius: 3px;">Overridden</span>' : ''}
            ${hasIssue && !isVerified && !isCustom ? '<span style="font-size: 0.75rem; background: rgba(245, 101, 101, 0.2); color: #f56565; padding: 0.1rem 0.4rem; border-radius: 3px;">Needs Review</span>' : ''}
          </div>
          <div style="font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem;">Variants: ${data.rawSamples.slice(0, 5).join(', ') || 'None'}</div>
        `;
        tdName.querySelector('.trade-title').textContent = trade;

        const tdCount = document.createElement('td');
        tdCount.className = 'count-col';
        tdCount.textContent = data.count;

        const tdSample = document.createElement('td');
        tdSample.className = 'example-col';
        tdSample.textContent = data.sample;

        const tdActions = document.createElement('td');
        tdActions.style.textAlign = 'right';

        const actionDiv = document.createElement('div');
        actionDiv.style.cssText = 'display: flex; gap: 0.5rem; justify-content: flex-end;';

        const btnVerify = document.createElement('button');
        btnVerify.className = `btn ${isVerified ? 'btn-secondary' : ''}`;
        btnVerify.style.cssText = 'padding: 0.4rem 0.75rem; font-size: 0.8rem;';
        btnVerify.textContent = isVerified ? 'Unmark' : '✓ Mark Complete';
        btnVerify.onclick = () => toggleVerified(trade);

        const btnEdit = document.createElement('button');
        btnEdit.className = 'btn btn-secondary';
        btnEdit.style.cssText = 'padding: 0.4rem 0.75rem; font-size: 0.8rem;';
        btnEdit.textContent = 'Edit Rule';
        btnEdit.onclick = () => editTradeRule(trade, data.rawSamples);

        actionDiv.appendChild(btnVerify);
        actionDiv.appendChild(btnEdit);
        tdActions.appendChild(actionDiv);

        tr.appendChild(tdName);
        tr.appendChild(tdCount);
        tr.appendChild(tdSample);
        tr.appendChild(tdActions);

        tbody.appendChild(tr);
      });
    }

    function showOverridesModal() {
      let modal = document.getElementById('overrides-modal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'overrides-modal';
        modal.style.cssText = `
          position: fixed; top: 0; left: 0; right: 0; bottom: 0;
          background: rgba(0,0,0,0.8); z-index: 1000; display: flex; align-items: center; justify-content: center;
        `;
        document.body.appendChild(modal);
      }

      const overrideEntries = Object.entries(tradeOverrides);
      let contentHtml = `
        <div style="background: var(--card-bg); border: 1px solid var(--card-border); padding: 2rem; border-radius: 8px; width: 600px; max-width: 90vw; max-height: 80vh; overflow-y: auto;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--card-border); padding-bottom: 1rem;">
            <h2 style="font-family: var(--heading-font); color: var(--accent); font-size: 2rem; font-weight: 400;">Active Trade Overrides</h2>
            <button class="btn btn-secondary" onclick="document.getElementById('overrides-modal').style.display='none'">Close</button>
          </div>
          <div style="margin-bottom: 1.5rem;">
            <button class="btn btn-secondary" style="margin-right: 0.5rem;" onclick="exportOverridesJSON()">Export Rules JSON</button>
            <button class="btn btn-secondary" onclick="clearAllOverrides()">Clear All Overrides</button>
          </div>
      `;

      if (overrideEntries.length === 0) {
        contentHtml += '<p style="color: var(--muted);">No custom rules or overrides defined yet. Click "Edit Rule" on any occupation row to customize it.</p>';
      } else {
        contentHtml += '<table style="width: 100%; border-collapse: collapse;"><thead><tr><th>Raw Input</th><th>Mapped Canonical Trade</th><th>Action</th></tr></thead><tbody>';
        overrideEntries.forEach(([raw, clean]) => {
          contentHtml += `
            <tr>
              <td><code>${raw}</code></td>
              <td style="color: var(--accent);">${clean}</td>
              <td><button class="btn btn-secondary" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;" onclick="removeOverride('${raw.replace(/'/g, "\\'")}')">Remove</button></td>
            </tr>
          `;
        });
        contentHtml += 'tbody></table>';
      }

      contentHtml += '</div>';
      modal.innerHTML = contentHtml;
      modal.style.display = 'flex';
    }

    function removeOverride(rawKey) {
      delete tradeOverrides[rawKey];
      saveOverrides();
      parseAndGroupTrades();
      showOverridesModal();
    }

    function clearAllOverrides() {
      if (confirm("Are you sure you want to clear all custom trade rules?")) {
        tradeOverrides = {};
        saveOverrides();
        parseAndGroupTrades();
        showOverridesModal();
      }
    }

    function exportOverridesJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tradeOverrides, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "trade_overrides.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    document.getElementById('trade-search').addEventListener('input', (e) => {
      renderTable(e.target.value);
    });

    window.addEventListener('DOMContentLoaded', loadTrades);
  </script>

</body>
